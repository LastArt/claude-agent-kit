<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта проекта {{PROJECT}} — Claude Agent Kit</title>
<style>
  :root{
    --bg:#f0eee6; --surface:#e3dacc; --text:#1f1e1a; --muted:#6b6459;
    --border:#d9d0be; --accent:#cc5f2e; --code:#ece7db; --panel:#f7f5ef;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  code,.mono{font:13px ui-monospace,"Cascadia Code",Consolas,monospace}

  .app{display:flex;height:100vh}
  .stage{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}

  .topbar{position:absolute;left:0;right:0;top:0;padding:14px 18px;pointer-events:none;
    background:linear-gradient(var(--bg),rgba(240,238,230,0));}
  .topbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .topbar .sub{margin:2px 0 0;color:var(--muted);font-size:13px}
  .pill{display:inline-block;background:var(--accent);color:#fff;border-radius:20px;
    padding:1px 10px;font-size:12px;font-weight:600;margin-left:6px;vertical-align:1px}

  .hint{position:absolute;left:18px;bottom:14px;color:var(--muted);font-size:12.5px;pointer-events:none}
  .zoom{position:absolute;right:18px;bottom:14px;display:flex;gap:6px}
  .zoom button{width:30px;height:30px;border:1px solid var(--border);background:var(--panel);
    color:var(--text);border-radius:8px;font-size:15px;cursor:pointer;line-height:1}
  .zoom button:hover{border-color:var(--accent);color:var(--accent)}

  aside{width:340px;flex:0 0 340px;background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;padding:16px 16px 40px}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:22px 0 8px;font-weight:700}
  aside h2:first-child{margin-top:0}

  .seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#fff}
  .seg button{flex:1;padding:7px 4px;border:0;background:transparent;color:var(--muted);
    font:600 13.5px inherit;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .seg button+button{border-left:1px solid var(--border)}

  .field{display:block;margin:8px 0}
  .field input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--border);
    border-radius:8px;background:#fff;font:14px inherit;color:var(--text)}
  .field input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;
    color:var(--muted);font-size:12.5px;margin-top:2px}
  label.check{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px;cursor:pointer}
  label.check input{accent-color:var(--accent);width:15px;height:15px}

  .card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0}
  .card .path{font:13px ui-monospace,Consolas,monospace;font-weight:700;word-break:break-all}
  .card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 0;font-size:13px}
  .card dt{color:var(--muted)}
  .card dd{margin:0}
  .empty{color:var(--muted);font-size:13.5px;margin:6px 0}

  ul.list{list-style:none;margin:6px 0;padding:0}
  ul.list li{padding:7px 9px;border:1px solid var(--border);border-radius:8px;margin:5px 0;
    background:#fff;cursor:pointer;font-size:13.5px}
  ul.list li:hover{border-color:var(--accent)}
  ul.list li.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(204,95,46,.15)}
  ul.list li .meta{color:var(--muted);font-size:12px;margin-top:2px}
  ul.list li .files{color:var(--muted);font-size:11.5px;margin-top:3px;
    font-family:ui-monospace,Consolas,monospace;word-break:break-all}

  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:6px 0}
  .legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

  .note{background:#141413;color:#fff;border-left:3px solid var(--accent);border-radius:8px;
    padding:10px 13px;margin:10px 0;font-size:12.5px;line-height:1.5}
  .note b{color:#fff}
  footer{color:var(--muted);font-size:12px;margin-top:20px;border-top:1px solid var(--border);padding-top:10px}

  .reader{position:fixed;inset:0;background:rgba(20,20,19,.55);z-index:20;
    display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
  .reader[hidden]{display:none}
  .reader .sheet{position:relative;background:var(--bg);border-radius:14px;max-width:780px;width:100%;
    padding:34px 40px 48px;box-shadow:0 18px 60px rgba(0,0,0,.3)}
  .reader .close{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:8px;
    border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:20px;
    line-height:1;cursor:pointer}
  .reader .close:hover{border-color:var(--accent);color:var(--accent)}
  .reader .kicker{margin:0;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .reader h1{margin:6px 0 18px;font-size:26px;line-height:1.25;letter-spacing:-.015em}
  .doc{font-size:15.5px;line-height:1.7}
  .doc h1,.doc h2,.doc h3,.doc h4{line-height:1.3;margin:26px 0 8px}
  .doc h1{font-size:21px;border-bottom:2px solid var(--border);padding-bottom:7px}
  .doc h2{font-size:18.5px;border-bottom:1px solid var(--border);padding-bottom:6px}
  .doc h3{font-size:16.5px}
  .doc h4{font-size:15px;color:var(--muted)}
  .doc p{margin:11px 0}
  .doc ul,.doc ol{margin:10px 0;padding-left:24px}
  .doc li{margin:5px 0}
  .doc blockquote{margin:14px 0;padding:6px 16px;border-left:3px solid var(--accent);
    background:var(--surface);border-radius:0 8px 8px 0;color:var(--muted)}
  .doc pre{background:#141413;color:#f0eee6;padding:13px 16px;border-radius:10px;overflow-x:auto;margin:14px 0}
  .doc pre code{background:none;color:inherit;padding:0;font-size:13px}
  .doc code{background:var(--code);padding:2px 6px;border-radius:6px;
    font:13.5px ui-monospace,Consolas,monospace}
  .doc hr{border:0;border-top:1px solid var(--border);margin:22px 0}
  .doc table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}
  .doc th,.doc td{border:1px solid var(--border);padding:7px 10px;text-align:left}
  .doc th{background:var(--surface)}
  .doc a{color:var(--accent)}
  .openbtn{display:block;width:100%;margin:8px 0 0;padding:9px 12px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;border-radius:9px;font:600 14px inherit;cursor:pointer}
  .openbtn:hover{filter:brightness(1.06)}

  @media (max-width:900px){
    body{overflow:auto}
    .app{flex-direction:column;height:auto}
    .stage{height:70vh}
    aside{width:auto;flex:none;border-left:none;border-top:1px solid var(--border)}
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="topbar">
      <h1>Карта проекта {{PROJECT}}<span class="pill">кит {{VERSION}}</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="hint">колесо — масштаб · тянуть фон — сдвинуть · тянуть узел — закрепить · двойной клик по узлу — отпустить</div>
    <div class="zoom">
      <button id="zin" title="Крупнее">+</button>
      <button id="zout" title="Мельче">&minus;</button>
      <button id="zfit" title="Вписать всё">&#9633;</button>
    </div>
  </div>
  <aside>
    <h2>Поиск</h2>
    <label class="field"><input type="search" id="q" placeholder="модуль или путь" autocomplete="off"></label>

    <h2>Уровень</h2>
    <div class="seg">
      <button id="lvModule" class="on">папки</button>
      <button id="lvFile">файлы</button>
      <button id="lvMemory">память</button>
    </div>
    <p class="empty" id="lvHint"></p>

    <h2>Что показывать</h2>
    <label class="check"><input type="checkbox" id="useGit" checked> связи из коммитов</label>
    <label class="check"><input type="checkbox" id="useTask" checked> связи из задач кита</label>
    <label class="field">
      <input type="range" id="minw" min="1" max="10" value="1">
      <span class="row"><span>сила связи от <b id="minwv">1</b></span><span id="linkcount"></span></span>
    </label>

    <h2>Выбранный модуль</h2>
    <div id="pick"><p class="empty">Кликните по кружку на карте.</p></div>

    <h2>Задачи из истории</h2>
    <div id="tasks"></div>

    <h2>Из чего собрано</h2>
    <div id="about"></div>
    <footer>Собрано <span id="gen"></span> · Claude Agent Kit</footer>
  </aside>
</div>

<div class="reader" id="reader" hidden>
  <div class="sheet">
    <button class="close" id="readerClose" title="Закрыть (Esc)">&times;</button>
    <p class="kicker" id="readerKicker"></p>
    <h1 id="readerTitle"></h1>
    <div class="doc" id="readerBody"></div>
  </div>
</div>

<script type="application/json" id="data">{{DATA}}</script>
<script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('data').textContent);

  // Карта живёт на двух уровнях: папки (общая картина) и файлы (что именно правят).
  // Оба собраны заранее и лежат в самой странице — переключение мгновенное и офлайновое.
  var level = 'module';
  var nodes = [], links = [], byId = {}, groups = [], maxScore = 1;
  var alpha = 1, picked = -1, hovered = -1, query = '', taskOn = -1;
  var state = { useGit: true, useTask: true, minw: 1 };
  var live = [];

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var view = { x: 0, y: 0, k: 1 };
  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  // -------- тип файла --------
  // Форма узла говорит, что это за файл, цвет — из какой он папки. Иконки нарисованы здесь же
  // примитивами: никаких сторонних наборов, лицензий и чужих логотипов — только геометрия.
  var CODE = ['js','mjs','cjs','jsx','ts','tsx','py','rb','go','rs','java','kt','kts','php','cs','cpp','cc','c','h','hpp','swift','scala','dart','lua','ex','exs','vue','svelte'];
  var SHELL = ['sh','bash','zsh','ps1','psm1','bat','cmd','fish'];
  var DATAF = ['json','yaml','yml','toml','ini','xml','csv','tsv','env','properties','plist'];
  var DOC = ['md','markdown','txt','rst','adoc','pdf','doc','docx'];
  var MARKUP = ['html','htm','xhtml','ejs','hbs','pug','jinja','tmpl','tpl'];
  var STYLE = ['css','scss','sass','less','styl'];
  var IMAGE = ['png','jpg','jpeg','gif','svg','webp','ico','bmp','avif'];
  var DB = ['sql','db','sqlite','sqlite3','prisma'];
  var CONFIGNAMES = ['dockerfile','makefile','gitignore','gitattributes','editorconfig','npmrc','nvmrc','browserslist','license','licence','codeowners'];

  function typeOf(id, node) {
    if (level === 'memory') return (node && node.kind) === 'explore' ? 'explore' : 'task';
    if (level === 'module') return 'folder';
    var name = id.split('/').pop().toLowerCase();
    // Тесты называют по-разному в каждом языке: user.test.ts, test_export.py, ExportSpec.kt,
    // да и просто лежат в tests/. Ловим и папку, и все ходовые формы имени.
    var base = name.replace(/\.[^.]+$/, '');
    if (/(^|\/)(tests?|__tests__|spec|specs)\//.test(id)
      || /(^|[._-])(test|tests|spec)([._-]|$)/.test(base)) return 'test';
    var bare = name.charAt(0) === '.' ? name.slice(1) : name;
    if (CONFIGNAMES.indexOf(bare.split('.')[0]) >= 0 || name.charAt(0) === '.') return 'config';
    var dot = name.lastIndexOf('.');
    var ext = dot > 0 ? name.slice(dot + 1) : '';
    if (CODE.indexOf(ext) >= 0) return 'code';
    if (SHELL.indexOf(ext) >= 0) return 'shell';
    if (DATAF.indexOf(ext) >= 0) return 'data';
    if (DOC.indexOf(ext) >= 0) return 'doc';
    if (MARKUP.indexOf(ext) >= 0) return 'markup';
    if (STYLE.indexOf(ext) >= 0) return 'style';
    if (IMAGE.indexOf(ext) >= 0) return 'image';
    if (DB.indexOf(ext) >= 0) return 'db';
    return 'other';
  }
  var TYPE_RU = {
    folder: 'папка', code: 'код', shell: 'скрипт', data: 'данные', doc: 'текст',
    markup: 'разметка', style: 'стили', image: 'картинка', db: 'база', test: 'тест',
    config: 'настройки', other: 'файл',
    task: 'задача', explore: 'разведка'
  };

  // -------- фигуры --------
  // Лист бумаги с загнутым уголком — файл. Папка — прямоугольник с язычком.
  function sheetPath(cx, cy, s) {
    var w = s * 1.55, h = s * 1.9, fold = s * 0.5;
    var x = cx - w / 2, y = cy - h / 2, r = s * 0.16;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - fold, y);
    ctx.lineTo(x + w, y + fold);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  function folderPath(cx, cy, s) {
    var w = s * 1.95, h = s * 1.5, r = s * 0.16, tab = w * 0.42, lip = s * 0.26;
    var x = cx - w / 2, y = cy - h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + tab, y);
    ctx.lineTo(x + tab + s * 0.22, y + lip);
    ctx.lineTo(x + w - r, y + lip); ctx.quadraticCurveTo(x + w, y + lip, x + w, y + lip + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // Глиф внутри листа: белая геометрия, которая читается даже мелкой.
  function glyph(kind, cx, cy, s) {
    ctx.lineWidth = Math.max(0.6, s * 0.15);
    ctx.strokeStyle = 'rgba(255,255,255,.96)';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var u = s * 0.45;
    ctx.beginPath();
    if (kind === 'code') {
      ctx.moveTo(cx - u * 0.25, cy - u * 0.7); ctx.lineTo(cx - u * 0.85, cy); ctx.lineTo(cx - u * 0.25, cy + u * 0.7);
      ctx.moveTo(cx + u * 0.25, cy - u * 0.7); ctx.lineTo(cx + u * 0.85, cy); ctx.lineTo(cx + u * 0.25, cy + u * 0.7);
    } else if (kind === 'data') {
      ctx.moveTo(cx - u * 0.15, cy - u * 0.8); ctx.quadraticCurveTo(cx - u * 0.75, cy - u * 0.8, cx - u * 0.75, cy);
      ctx.quadraticCurveTo(cx - u * 0.75, cy + u * 0.8, cx - u * 0.15, cy + u * 0.8);
      ctx.moveTo(cx + u * 0.15, cy - u * 0.8); ctx.quadraticCurveTo(cx + u * 0.75, cy - u * 0.8, cx + u * 0.75, cy);
      ctx.quadraticCurveTo(cx + u * 0.75, cy + u * 0.8, cx + u * 0.15, cy + u * 0.8);
    } else if (kind === 'shell') {
      ctx.moveTo(cx - u * 0.75, cy - u * 0.6); ctx.lineTo(cx - u * 0.15, cy - u * 0.05); ctx.lineTo(cx - u * 0.75, cy + u * 0.5);
      ctx.moveTo(cx + u * 0.05, cy + u * 0.6); ctx.lineTo(cx + u * 0.8, cy + u * 0.6);
    } else if (kind === 'markup') {
      ctx.moveTo(cx - u * 0.35, cy - u * 0.65); ctx.lineTo(cx - u * 0.9, cy); ctx.lineTo(cx - u * 0.35, cy + u * 0.65);
      ctx.moveTo(cx + u * 0.2, cy - u * 0.75); ctx.lineTo(cx - u * 0.05, cy + u * 0.75);
      ctx.moveTo(cx + u * 0.45, cy - u * 0.65); ctx.lineTo(cx + u * 0.9, cy); ctx.lineTo(cx + u * 0.45, cy + u * 0.65);
    } else if (kind === 'style') {
      ctx.moveTo(cx, cy - u * 0.85);
      ctx.quadraticCurveTo(cx + u * 0.8, cy + u * 0.15, cx, cy + u * 0.8);
      ctx.quadraticCurveTo(cx - u * 0.8, cy + u * 0.15, cx, cy - u * 0.85);
    } else if (kind === 'image') {
      ctx.rect(cx - u * 0.85, cy - u * 0.7, u * 1.7, u * 1.4);
      ctx.moveTo(cx - u * 0.8, cy + u * 0.4); ctx.lineTo(cx - u * 0.2, cy - u * 0.2);
      ctx.lineTo(cx + u * 0.3, cy + u * 0.3); ctx.lineTo(cx + u * 0.55, cy + u * 0.05);
      ctx.lineTo(cx + u * 0.8, cy + u * 0.4);
    } else if (kind === 'db') {
      ctx.ellipse(cx, cy - u * 0.5, u * 0.72, u * 0.28, 0, 0, Math.PI * 2);
      ctx.moveTo(cx - u * 0.72, cy - u * 0.5); ctx.lineTo(cx - u * 0.72, cy + u * 0.45);
      ctx.quadraticCurveTo(cx, cy + u, cx + u * 0.72, cy + u * 0.45);
      ctx.lineTo(cx + u * 0.72, cy - u * 0.5);
    } else if (kind === 'test') {
      ctx.moveTo(cx - u * 0.35, cy - u * 0.75); ctx.lineTo(cx - u * 0.35, cy - u * 0.1);
      ctx.lineTo(cx - u * 0.75, cy + u * 0.7); ctx.lineTo(cx + u * 0.75, cy + u * 0.7);
      ctx.lineTo(cx + u * 0.35, cy - u * 0.1); ctx.lineTo(cx + u * 0.35, cy - u * 0.75);
      ctx.moveTo(cx - u * 0.5, cy - u * 0.75); ctx.lineTo(cx + u * 0.5, cy - u * 0.75);
    } else if (kind === 'config') {
      ctx.arc(cx, cy, u * 0.4, 0, Math.PI * 2);
      for (var a = 0; a < 6; a++) {
        var an = a * Math.PI / 3;
        ctx.moveTo(cx + Math.cos(an) * u * 0.58, cy + Math.sin(an) * u * 0.58);
        ctx.lineTo(cx + Math.cos(an) * u * 0.92, cy + Math.sin(an) * u * 0.92);
      }
    } else if (kind === 'task') {
      ctx.moveTo(cx - u * 0.7, cy - u * 0.15); ctx.lineTo(cx - u * 0.2, cy + u * 0.45);
      ctx.lineTo(cx + u * 0.75, cy - u * 0.6);
    } else if (kind === 'explore') {
      ctx.arc(cx - u * 0.15, cy - u * 0.15, u * 0.55, 0, Math.PI * 2);
      ctx.moveTo(cx + u * 0.25, cy + u * 0.25); ctx.lineTo(cx + u * 0.8, cy + u * 0.8);
    } else if (kind === 'folder') {
      ctx.moveTo(cx - u * 0.55, cy + u * 0.2); ctx.lineTo(cx + u * 0.55, cy + u * 0.2);
    } else {
      for (var i = -1; i <= 1; i++) {
        ctx.moveTo(cx - u * 0.7, cy + i * u * 0.5);
        ctx.lineTo(cx + (i === 1 ? u * 0.15 : u * 0.7), cy + i * u * 0.5);
      }
    }
    ctx.stroke();
  }

  // -------- цвет --------
  // Оттенки вокруг фирменного оранжевого: карта остаётся в палитре набора и не превращается
  // в новогоднюю гирлянду. Цвет — это папка, из которой файл.
  var HUES = [18, 200, 145, 275, 45, 0, 235, 95, 320, 170];
  function colorOf(group, alpha) {
    var i = groups.indexOf(group);
    var h = HUES[(i < 0 ? 0 : i) % HUES.length];
    var l = 44 + ((i / HUES.length | 0) % 2) * 12;
    return 'hsla(' + h + ',52%,' + l + '%,' + (alpha === undefined ? 1 : alpha) + ')';
  }

  // -------- загрузка уровня --------
  function loadLevel(name) {
    level = name;
    var lv = DATA.levels[name];
    nodes = lv.nodes.map(function (n) {
      return { id: n.id, group: n.group, commits: n.commits, files: n.files, score: n.score,
        first: n.first, last: n.last, tasks: n.tasks || [],
        kind: n.kind || '', title: n.title || '', date: n.date || '', subtitle: n.subtitle || '',
        x: 0, y: 0, vx: 0, vy: 0, fixed: false, r: 0, type: '' };
    });
    byId = {};
    nodes.forEach(function (n, i) { byId[n.id] = i; });

    groups = [];
    nodes.forEach(function (n) { if (groups.indexOf(n.group) < 0) groups.push(n.group); });

    maxScore = 1;
    nodes.forEach(function (n) { if (n.score > maxScore) maxScore = n.score; });
    nodes.forEach(function (n) {
      n.r = 8 + 16 * Math.sqrt(n.score / maxScore);   // размер = важность узла
      n.type = typeOf(n.id, n);
    });

    links = [];
    lv.links.forEach(function (l) {
      var a = byId[l.source], b = byId[l.target];
      if (a === undefined || b === undefined) return;
      links.push({ a: a, b: b, git: l.git || 0, task: l.task || 0 });
    });

    picked = -1; hovered = -1; taskOn = -1;
    live = activeLinks();   // строго до step(): иначе раскладка пойдёт по связям прошлого уровня
    seed();
    for (var s = 0; s < 260; s++) step();
    refreshLinks();
    select(-1);
    renderTasks();
    renderHead();
    renderAbout();
    fit();
  }

  function weightOf(l) {
    var w = 0;
    if (state.useGit) w += l.git;
    if (state.useTask) w += l.task * 2;   // задача — осознанная связь, весит больше соседства
    return w;
  }
  function activeLinks() {
    var res = [];
    for (var i = 0; i < links.length; i++) {
      var w = weightOf(links[i]);
      if (w >= state.minw) res.push({ l: links[i], w: w });
    }
    return res;
  }

  function seed() {
    var R = Math.min(W, H) * 0.36 || 260;
    nodes.forEach(function (n, i) {
      var a = (i / nodes.length) * Math.PI * 2;
      var rr = R * (0.35 + 0.65 * Math.sqrt((i % 7) / 7 + 0.1));
      n.x = Math.cos(a) * rr; n.y = Math.sin(a) * rr; n.vx = 0; n.vy = 0;
    });
    alpha = 1;
  }

  // -------- раскладка --------
  // Обычная силовая укладка: узлы отталкиваются, связи стягивают, центр придерживает.
  // Узлов сотни, не тысячи (потолок ставит сборщик), поэтому честный перебор пар допустим
  // и код остаётся читаемым — никаких деревьев Барнса-Хата.
  function step() {
    var i, j, n, m, dx, dy, d2, d, f;
    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      for (j = i + 1; j < nodes.length; j++) {
        m = nodes[j];
        dx = m.x - n.x; dy = m.y - n.y;
        d2 = dx * dx + dy * dy;
        if (d2 < 1) { d2 = 1; dx = (Math.random() - 0.5); dy = (Math.random() - 0.5); }
        if (d2 > 900000) continue;
        f = (2600 + (n.r + m.r) * 60) / d2;
        d = Math.sqrt(d2);
        n.vx -= dx / d * f; n.vy -= dy / d * f;
        m.vx += dx / d * f; m.vy += dy / d * f;
      }
    }
    for (i = 0; i < live.length; i++) {
      n = nodes[live[i].l.a]; m = nodes[live[i].l.b];
      dx = m.x - n.x; dy = m.y - n.y;
      d = Math.sqrt(dx * dx + dy * dy) || 1;
      var rest = 92 + n.r + m.r;
      var pull = Math.min(0.9, 0.06 + live[i].w * 0.012);
      f = (d - rest) * pull * 0.12;
      n.vx += dx / d * f; n.vy += dy / d * f;
      m.vx -= dx / d * f; m.vy -= dy / d * f;
    }
    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      n.vx -= n.x * 0.0022; n.vy -= n.y * 0.0022;
      if (n.fixed) { n.vx = 0; n.vy = 0; continue; }
      n.vx *= 0.84; n.vy *= 0.84;
      n.x += n.vx * alpha; n.y += n.vy * alpha;
    }
    alpha *= 0.985;
  }

  // -------- отрисовка --------
  function labelOf(n) { return level === 'memory' ? (n.title || n.id) : n.id; }
  function matches(n) {
    return !query || (labelOf(n) + ' ' + n.id).toLowerCase().indexOf(query) >= 0;
  }
  function inTask(i) {
    if (taskOn < 0) return false;
    var t = DATA.tasks[taskOn];
    return !!t && (t[level] || []).indexOf(nodes[i].id) >= 0;
  }
  function dimmed(i) {
    if (taskOn >= 0) return !inTask(i);
    if (query) return !matches(nodes[i]);
    return false;
  }
  function shortName(n) {
    var s = labelOf(n);
    if (level === 'file') s = s.split('/').pop();
    var lim = level === 'memory' ? 30 : 24;
    if (level === 'module') return s.length > 28 ? '…' + s.slice(-27) : s;
    return s.length > lim ? s.slice(0, lim - 1) + '…' : s;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2 + view.x, H / 2 + view.y);
    ctx.scale(view.k, view.k);

    var i, l, n, m;
    for (i = 0; i < live.length; i++) {
      l = live[i].l; n = nodes[l.a]; m = nodes[l.b];
      var faded = dimmed(l.a) || dimmed(l.b);
      var near = picked >= 0 && (l.a === picked || l.b === picked);
      if (faded && !near) continue;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y); ctx.lineTo(m.x, m.y);
      ctx.lineWidth = Math.min(5, 0.6 + live[i].w * 0.35);
      ctx.strokeStyle = near ? 'rgba(204,95,46,.75)'
        : l.task > 0 ? 'rgba(204,95,46,.28)' : 'rgba(107,100,89,.22)';
      ctx.stroke();
    }

    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      var faint = dimmed(i);
      var onScreen = n.r * view.k;

      if (onScreen < 4) {
        // Мельче четырёх пикселей иконка всё равно не читается — рисуем точку и не тратим кадр.
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = colorOf(n.group, faint ? 0.16 : 0.92); ctx.fill();
      } else {
        if (level === 'module') folderPath(n.x, n.y, n.r); else sheetPath(n.x, n.y, n.r);
        ctx.fillStyle = colorOf(n.group, faint ? 0.16 : 0.94);
        ctx.fill();
        if (i === picked || i === hovered) { ctx.lineWidth = 2.5 / view.k; ctx.strokeStyle = '#1f1e1a'; ctx.stroke(); }
        else if (inTask(i)) { ctx.lineWidth = 2 / view.k; ctx.strokeStyle = '#cc5f2e'; ctx.stroke(); }
        if (!faint && onScreen > 7) glyph(n.type, n.x, n.y + (level === 'module' ? n.r * 0.1 : 0), n.r);
      }

      var label = onScreen > 13 || i === picked || i === hovered || view.k > 1.6;
      if (label && !faint) {
        var text = shortName(n);
        // Размер держим в ЭКРАННЫХ пикселях: холст уже отмасштабирован, поэтому делим на view.k.
        var fs = 12 / view.k;
        ctx.font = '600 ' + fs + 'px ui-monospace,Consolas,monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        var tw = ctx.measureText(text).width;
        var top = n.y + n.r * (level === 'module' ? 0.85 : 1.05) + fs * 0.25;
        ctx.fillStyle = 'rgba(240,238,230,.78)';
        ctx.fillRect(n.x - tw / 2 - fs * 0.25, top, tw + fs * 0.5, fs * 1.2);
        ctx.fillStyle = '#1f1e1a';
        ctx.fillText(text, n.x, top + fs * 0.1);
      }
    }
    ctx.restore();
  }

  function tick() {
    if (alpha > 0.004) { step(); draw(); }
    requestAnimationFrame(tick);
  }

  function resize() {
    var rect = cv.getBoundingClientRect();
    W = rect.width; H = rect.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    draw();
  }

  // -------- взаимодействие --------
  function toWorld(px, py) {
    return { x: (px - W / 2 - view.x) / view.k, y: (py - H / 2 - view.y) / view.k };
  }
  function nodeAt(px, py) {
    var p = toWorld(px, py), best = -1, bestD = 1e9;
    for (var i = 0; i < nodes.length; i++) {
      var dx = nodes[i].x - p.x, dy = nodes[i].y - p.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < nodes[i].r + 4 && d < bestD) { best = i; bestD = d; }
    }
    return best;
  }

  var drag = null, panning = null;
  cv.addEventListener('mousedown', function (e) {
    var rect = cv.getBoundingClientRect();
    var hit = nodeAt(e.clientX - rect.left, e.clientY - rect.top);
    if (hit >= 0) { drag = hit; nodes[hit].fixed = true; select(hit); }
    else { panning = { x: e.clientX - view.x, y: e.clientY - view.y }; cv.classList.add('dragging'); }
  });
  window.addEventListener('mousemove', function (e) {
    var rect = cv.getBoundingClientRect();
    var px = e.clientX - rect.left, py = e.clientY - rect.top;
    if (drag !== null) {
      var p = toWorld(px, py);
      nodes[drag].x = p.x; nodes[drag].y = p.y;
      alpha = Math.max(alpha, 0.35); draw();
      return;
    }
    if (panning) { view.x = e.clientX - panning.x; view.y = e.clientY - panning.y; draw(); return; }
    if (px < 0 || py < 0 || px > W || py > H) return;
    var h = nodeAt(px, py);
    if (h !== hovered) { hovered = h; cv.style.cursor = h >= 0 ? 'pointer' : 'grab'; draw(); }
  });
  window.addEventListener('mouseup', function () { drag = null; panning = null; cv.classList.remove('dragging'); });
  cv.addEventListener('dblclick', function (e) {
    var rect = cv.getBoundingClientRect();
    var hit = nodeAt(e.clientX - rect.left, e.clientY - rect.top);
    if (hit < 0) return;
    if (level === 'memory') { openDoc(nodes[hit].id); return; }
    nodes[hit].fixed = false; alpha = Math.max(alpha, 0.5);
  });
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    var rect = cv.getBoundingClientRect();
    var px = e.clientX - rect.left, py = e.clientY - rect.top;
    var before = toWorld(px, py);
    view.k = Math.max(0.15, Math.min(6, view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    var after = toWorld(px, py);
    view.x += (after.x - before.x) * view.k;
    view.y += (after.y - before.y) * view.k;
    draw();
  }, { passive: false });

  function fit() {
    if (!nodes.length) return;
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    nodes.forEach(function (n) {
      minX = Math.min(minX, n.x - n.r); maxX = Math.max(maxX, n.x + n.r);
      minY = Math.min(minY, n.y - n.r); maxY = Math.max(maxY, n.y + n.r);
    });
    var w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
    view.k = Math.max(0.15, Math.min(2.2, Math.min(W / (w + 120), H / (h + 120))));
    view.x = -((minX + maxX) / 2) * view.k;
    view.y = -((minY + maxY) / 2) * view.k;
    draw();
  }
  document.getElementById('zin').onclick = function () { view.k = Math.min(6, view.k * 1.25); draw(); };
  document.getElementById('zout').onclick = function () { view.k = Math.max(0.15, view.k / 1.25); draw(); };
  document.getElementById('zfit').onclick = fit;

  // -------- панель --------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  var pickBox = document.getElementById('pick');
  function select(i) {
    picked = i;
    pickBox.innerHTML = '';
    if (i < 0) {
      pickBox.appendChild(el('p', 'empty', level === 'module' ? 'Кликните по папке на карте.'
        : level === 'file' ? 'Кликните по файлу на карте.'
        : 'Кликните по записи — откроется карточка, двойной клик показывает её целиком.'));
      draw();
      return;
    }
    var n = nodes[i];
    var card = el('div', 'card');
    card.appendChild(el('div', 'path', labelOf(n)));
    var dl = el('dl');
    function add(k, v) { dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v)); }
    add('тип', TYPE_RU[n.type] || 'файл');
    if (level === 'memory') {
      if (n.date) add('дата', n.date);
      if (n.subtitle) add('итог', n.subtitle);
      if (n.files) add('файлов', String(n.files));
    } else {
      add('важность', String(n.score));
      add('коммитов', String(n.commits));
      if (level === 'module') add('файлов', String(n.files));
      if (n.first) add('правился', n.first === n.last ? n.last : n.first + ' … ' + n.last);
      if (n.tasks.length) add('в задачах', String(n.tasks.length));
    }
    card.appendChild(dl);
    if (level === 'memory' && (DATA.docs || {})[n.id]) {
      var btn = el('button', 'openbtn', 'Открыть запись целиком');
      btn.onclick = function () { openDoc(n.id); };
      card.appendChild(btn);
    }
    pickBox.appendChild(card);

    var near = [];
    for (var j = 0; j < live.length; j++) {
      var l = live[j].l;
      if (l.a === i) near.push({ i: l.b, w: live[j].w, task: l.task });
      else if (l.b === i) near.push({ i: l.a, w: live[j].w, task: l.task });
    }
    near.sort(function (a, b) { return b.w - a.w; });
    if (!near.length) {
      pickBox.appendChild(el('p', 'empty', 'Связей при текущих настройках нет — ослабьте фильтр.'));
    } else {
      var ul = el('ul', 'list');
      near.slice(0, 8).forEach(function (x) {
        var li = el('li');
        li.appendChild(el('div', null, nodes[x.i].id));
        li.appendChild(el('div', 'meta', 'вместе в ' + x.w + ' ' + plural(x.w, 'случае', 'случаях', 'случаях')
          + (x.task ? ' · есть общая задача' : '')));
        li.onclick = function () { select(x.i); view.x = -nodes[x.i].x * view.k; view.y = -nodes[x.i].y * view.k; draw(); };
        ul.appendChild(li);
      });
      pickBox.appendChild(ul);
    }
    draw();
  }

  var tasksBox = document.getElementById('tasks');
  function renderTasks() {
    tasksBox.innerHTML = '';
    if (!DATA.tasks.length) {
      tasksBox.appendChild(el('p', 'empty',
        'История задач пуста. Она наполняется сама, когда задачи проходят через конвейер кита, — и тогда здесь появится подсветка «что трогали в этой доработке».'));
      return;
    }
    var ul = el('ul', 'list');
    DATA.tasks.forEach(function (t, ti) {
      var li = el('li');
      if (ti === taskOn) li.className = 'on';
      var hit = (t[level] || []).length;
      if (level === 'memory') hit = 1;
      li.appendChild(el('div', null, t.title));
      li.appendChild(el('div', 'meta', (t.date || '') + (t.outcome ? ' · ' + t.outcome : '')
        + (level === 'memory' ? '' : ' · ' + hit + ' ' + (level === 'module'
          ? plural(hit, 'папка', 'папки', 'папок')
          : plural(hit, 'файл', 'файла', 'файлов')) + ' на карте')));
      if (t.files.length) li.appendChild(el('div', 'files', t.files.join(' · ')));
      li.onclick = function () { taskOn = (taskOn === ti) ? -1 : ti; renderTasks(); draw(); };
      ul.appendChild(li);
    });
    tasksBox.appendChild(ul);
  }

  function renderHead() {
    var lv = DATA.levels[level];
    document.getElementById('sub').textContent =
      nodes.length + ' ' + (level === 'module'
        ? plural(nodes.length, 'папка', 'папки', 'папок')
        : level === 'file'
          ? plural(nodes.length, 'файл', 'файла', 'файлов')
          : plural(nodes.length, 'запись', 'записи', 'записей'))
      + ' · ' + links.length + ' ' + plural(links.length, 'связь', 'связи', 'связей')
      + ' · ' + DATA.tasks.length + ' ' + plural(DATA.tasks.length, 'задача', 'задачи', 'задач') + ' из истории';
    document.getElementById('lvHint').textContent = level === 'module'
      ? 'Папки: общая картина, с чего смотреть.'
      : level === 'file'
        ? (lv.dropped
          ? 'Файлы: ' + nodes.length + ' самых важных из ' + lv.total + ' (важность = как часто правят + сколько задач прошло).'
          : 'Файлы: все ' + lv.total + ' — важность = как часто правят + сколько задач прошло.')
        : (nodes.length
          ? 'Память: задачи и разведки. Связи — общие файлы, общий модуль, общая тема. Двойной клик открывает запись.'
          : 'Память пуста: она копится сама, когда задачи проходят через конвейер и сохраняются разведки.');
    document.getElementById('lvModule').className = level === 'module' ? 'on' : '';
    document.getElementById('lvFile').className = level === 'file' ? 'on' : '';
    document.getElementById('lvMemory').className = level === 'memory' ? 'on' : '';
    document.getElementById('q').placeholder = level === 'memory' ? 'задача или разведка' : 'модуль или путь';
  }

  function renderAbout() {
    var m = DATA.meta, box = document.getElementById('about'), lines = [];
    box.innerHTML = '';
    lines.push(m.hasGit
      ? 'Просмотрено коммитов: ' + m.commitsScanned + ' (из последних ' + m.commitsRequested + ').'
      : 'git в проекте не найден — связи только из истории задач.');
    if (m.bulkSkipped) {
      lines.push('Массовых коммитов пропущено: ' + m.bulkSkipped
        + ' (больше ' + m.bulkLimit + ' файлов — такие связывают всё со всем и связей не доказывают).');
    }
    lines.push('Папки собраны до ' + m.depth + '-го уровня пути.');
    var lm = DATA.levels.module, lf = DATA.levels.file;
    if (lm.dropped) lines.push('Папок на карте: ' + lm.nodes.length + ' из ' + lm.total + ' (ключ --max-nodes покажет все).');
    if (lf.dropped) lines.push('Файлов на карте: ' + lf.nodes.length + ' из ' + lf.total + ' — самые важные (ключ --files покажет больше).');
    lines.push('Память: ' + m.tasksFound + ' ' + plural(m.tasksFound, 'задача', 'задачи', 'задач')
      + ' из истории и ' + (m.exploresFound || 0) + ' ' + plural(m.exploresFound || 0, 'разведка', 'разведки', 'разведок')
      + ' из кэша.');
    if (lm.linksDropped || lf.linksDropped) lines.push('Часть самых слабых связей не поместилась на карту.');
    if (m.hideKit) lines.push('Папка .claude/ скрыта как служебная (ключ --with-kit покажет её).');
    if (m.kitForced) lines.push('Папка .claude/ показана: без неё карта осталась бы пустой.');
    lines.forEach(function (t) { box.appendChild(el('p', 'empty', t)); });

    var note = el('div', 'note');
    note.innerHTML = '<b>Как читать.</b> Значок — папка или файл, размер — важность: как часто правят '
      + 'и сколько задач через него прошло. Форма значка говорит про тип файла, цвет — про папку, в которой он лежит. '
      + 'Линия значит «меняли вместе»: серая — так вышло по коммитам, оранжевая — их свела общая задача кита. '
      + 'Это карта того, как проект правят, а не схема импортов — и обычно она честнее. '
      + '<br><br>На уровне <b>памяти</b> узлы — не код, а накопленное о нём знание: завершённые задачи и сохранённые '
      + 'разведки. Там линия значит «об одном и том же»: общие файлы, общий модуль или общая тема в заголовке. '
      + 'Двойной клик открывает запись целиком, прямо здесь.';
    box.appendChild(note);

    var lg = el('div', 'legend');
    groups.slice(0, 12).forEach(function (g) {
      var s = el('span');
      var i = el('i'); i.style.background = colorOf(g);
      s.appendChild(i); s.appendChild(el('span', null, g));
      lg.appendChild(s);
    });
    box.appendChild(lg);
  }

  // -------- читалка --------
  // Записи памяти — обычный markdown. Показываем его как документ прямо в странице:
  // никакого внешнего просмотрщика, никакой библиотеки — разбор построчный и минимальный,
  // ровно на то, чем пишут агенты кита: заголовки, списки, таблицы, код, цитаты.
  function escHtml(s) {
    return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');
  }
  function inline(s) {
    var out = escHtml(s);
    out = out.replace(/`([^`]+)`/g, function (m, c) { return '<code>' + c + '</code>'; });
    out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    out = out.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>');
    out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return out;
  }
  function mdToHtml(src) {
    var lines = String(src).split('\n');
    var html = [], i, inCode = false, listType = '', para = [];

    function flushPara() {
      if (para.length) { html.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; }
    }
    function closeList() { if (listType) { html.push('</' + listType + '>'); listType = ''; } }

    for (i = 0; i < lines.length; i++) {
      var ln = lines[i];

      if (/^```/.test(ln)) {
        flushPara(); closeList();
        if (!inCode) { html.push('<pre><code>'); inCode = true; }
        else { html.push('</code></pre>'); inCode = false; }
        continue;
      }
      if (inCode) { html.push(escHtml(ln) + '\n'); continue; }

      if (!ln.trim()) { flushPara(); closeList(); continue; }

      var h = ln.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        flushPara(); closeList();
        var lvl = Math.min(4, h[1].length);
        html.push('<h' + lvl + '>' + inline(h[2]) + '</h' + lvl + '>');
        continue;
      }
      if (/^\s*([-*_])\1{2,}\s*$/.test(ln)) { flushPara(); closeList(); html.push('<hr>'); continue; }
      if (/^\s*>\s?/.test(ln)) {
        flushPara(); closeList();
        html.push('<blockquote>' + inline(ln.replace(/^\s*>\s?/, '')) + '</blockquote>');
        continue;
      }
      // таблица: строку-разделитель проглатываем, остальные строки идут ячейками
      if (/^\s*\|/.test(ln)) {
        flushPara(); closeList();
        if (/^\s*\|[\s:|-]+\|\s*$/.test(ln)) continue;
        var cells = ln.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|');
        var head = !/<table/.test(html[html.length - 1] || '') && !/<\/tr>/.test(html[html.length - 1] || '');
        if (head) html.push('<table>');
        html.push('<tr>' + cells.map(function (c) {
          return head ? '<th>' + inline(c.trim()) + '</th>' : '<td>' + inline(c.trim()) + '</td>';
        }).join('') + '</tr>');
        if (i + 1 >= lines.length || !/^\s*\|/.test(lines[i + 1])) html.push('</table>');
        continue;
      }
      var ul = ln.match(/^\s*[-*+]\s+(.*)$/);
      var ol = ln.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ul || ol) {
        flushPara();
        var want = ul ? 'ul' : 'ol';
        if (listType !== want) { closeList(); html.push('<' + want + '>'); listType = want; }
        html.push('<li>' + inline((ul || ol)[1]) + '</li>');
        continue;
      }
      para.push(ln.trim());
    }
    flushPara(); closeList();
    if (inCode) html.push('</code></pre>');
    return html.join('');
  }

  var readerBox = document.getElementById('reader');
  function openDoc(id) {
    var doc = (DATA.docs || {})[id];
    if (!doc) return;
    document.getElementById('readerKicker').textContent =
      doc.kind + (doc.date ? ' · ' + doc.date : '');
    document.getElementById('readerTitle').textContent = doc.title || id;
    document.getElementById('readerBody').innerHTML = mdToHtml(doc.text || '');
    readerBox.hidden = false;
  }
  function closeDoc() { readerBox.hidden = true; }
  document.getElementById('readerClose').onclick = closeDoc;
  readerBox.onclick = function (e) { if (e.target === readerBox) closeDoc(); };
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDoc(); });

  // -------- контролы --------
  var minwEl = document.getElementById('minw'), minwv = document.getElementById('minwv');
  var linkCount = document.getElementById('linkcount');
  function refreshLinks() {
    live = activeLinks();
    linkCount.textContent = live.length + ' ' + plural(live.length, 'связь', 'связи', 'связей');
    alpha = Math.max(alpha, 0.5);
    if (picked >= 0) select(picked); else draw();
  }
  minwEl.oninput = function () { state.minw = +minwEl.value; minwv.textContent = minwEl.value; refreshLinks(); };
  document.getElementById('useGit').onchange = function () { state.useGit = this.checked; refreshLinks(); };
  document.getElementById('useTask').onchange = function () { state.useTask = this.checked; refreshLinks(); };
  document.getElementById('q').oninput = function () { query = this.value.trim().toLowerCase(); draw(); };
  document.getElementById('lvModule').onclick = function () { if (level !== 'module') loadLevel('module'); };
  document.getElementById('lvFile').onclick = function () { if (level !== 'file') loadLevel('file'); };
  document.getElementById('lvMemory').onclick = function () { if (level !== 'memory') loadLevel('memory'); };

  document.getElementById('gen').textContent = DATA.generated || '';
  window.addEventListener('resize', resize);

  resize();
  loadLevel('module');   // renderAbout вызывается внутри — легенда всегда под текущий уровень
  tick();
})();
</script>
